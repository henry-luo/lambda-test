<!doctype html>
<meta charset="utf-8">
<title>Lambda bootstrap selection editing smoke</title>
<div id="test" contenteditable>abc</div>
<script>
description("Bootstrap Chrome editing selection smoke.");

var host = document.getElementById("test");
var selection = getSelection();
selection.collapse(host.firstChild, 1);

shouldBeEqualToString("selection.focusNode.nodeValue", "abc");
shouldBe("selection.focusOffset", "1");
</script>
