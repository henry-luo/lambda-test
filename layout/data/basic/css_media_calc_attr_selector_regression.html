<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS media calc attr selector regression</title>
<style>
  body {
    margin: 8px;
    font-family: Arial, sans-serif;
  }

  @media (orientation: landscape) {
    body {
      margin-left: 10%;
      margin-right: 10%;
    }
  }

  h2 {
    margin: 0 0 12px;
    font-size: 20px;
    line-height: 1;
  }

  h2.h1 {
    font-size: calc(20px + 1vw);
  }

  .row {
    margin-top: 6px;
    font-size: 16px;
    line-height: 24px;
  }

  i {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-left: 0;
    margin-right: 4px;
    vertical-align: top;
    background: red;
  }

  [class^="ti-"],
  [class*=" ti-"] {
    width: 40px;
    height: 20px;
    margin-left: 7px;
    background: green;
  }
</style>
</head>
<body>
  <h2 class="h1">Calc Title</h2>
  <div class="row"><i class="ti-ruler-pencil"></i><span>prefix selector</span></div>
  <div class="row"><i class="foo ti-pencil-alt"></i><span>substring selector</span></div>
</body>
</html>
