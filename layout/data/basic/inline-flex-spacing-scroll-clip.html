<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Inline flex spacing and scroll clip regression</title>
<style>
  body {
    margin: 24px;
    font-family: Arial, sans-serif;
    font-size: 16px;
    color: #172033;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid #27344f;
    border-radius: 999px;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: #eef4ff;
  }

  .badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 999px;
    background: #08d6b0;
    color: #001b25;
    font-weight: 700;
  }

  .clipbox {
    width: 360px;
    height: 130px;
    margin-top: 28px;
    overflow: auto;
    border: 2px solid #38445a;
    background: #ffffff;
  }

  .wide-content {
    width: 620px;
    height: 230px;
    padding: 16px;
    box-sizing: border-box;
    background: linear-gradient(90deg, #dff7ff 0%, #f6fff0 100%);
  }

  .wide-content h2 {
    margin: 0 0 12px;
    font-size: 24px;
    line-height: 1.1;
  }

  .wide-content p {
    width: 560px;
    margin: 0;
    line-height: 24px;
  }
</style>
</head>
<body>
  <div class="pill"><span class="badge">End-to-end pipeline</span> Transform · Validate · Layout · Render</div>

  <div class="clipbox">
    <div class="wide-content">
      <h2>Scrollable content stays inside the viewport</h2>
      <p>This panel is deliberately wider and taller than the scroll container so the rendered content must be clipped to the scrollport.</p>
    </div>
  </div>
</body>
</html>
