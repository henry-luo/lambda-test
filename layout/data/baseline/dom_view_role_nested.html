<!DOCTYPE html>
<html><head><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.grid { display: grid; grid-template-columns: 300px; width: 320px; padding: 10px; }
.flex { display: flex; width: 100%; padding: 8px; }
table { display: table; flex: 0 0 113px; width: 113px; border-spacing: 11px 6px; border: 2px solid red; }
td { height: 22px; border: 1px solid black; }
</style></head><body>
<div class="grid"><div class="flex"><table><tr><td>nested</td><td>table</td></tr></table></div></div>
</body></html>
