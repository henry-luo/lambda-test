<!doctype html>
<meta charset="utf-8">
<title>Radiant inline block baseline in flex grid table cells</title>
<style>
body {
  margin: 0;
  font: 16px Arial, sans-serif;
}
.flex {
  display: flex;
  align-items: baseline;
  margin: 20px;
  border: 1px solid #999;
}
.table {
  display: table;
  margin: 20px;
  border-spacing: 4px;
}
.cell {
  display: table-cell;
  vertical-align: baseline;
  padding: 4px;
  border: 1px solid #8c5b25;
}
.ib {
  display: inline-block;
  padding: 4px;
  border: 2px solid #376b8f;
  font-size: 24px;
}
.small {
  font-size: 12px;
}
</style>
<div class="flex">
  <span class="ib">Big</span>
  <span class="ib small">small</span>
</div>
<div class="table">
  <span class="cell"><span class="ib">Cell</span></span>
  <span class="cell"><span class="ib small">base</span></span>
</div>
