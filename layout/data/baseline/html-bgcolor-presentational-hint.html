<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>HTML bgcolor presentational hint regression</title>
  <style>
    body {
      margin: 8px;
      font: 14px Arial, sans-serif;
    }
    table {
      border-collapse: collapse;
      color: #111;
    }
    td {
      width: 120px;
      height: 34px;
      padding: 4px 8px;
    }
    .header {
      font-weight: bold;
    }
    .css-override {
      background-color: #3355aa;
      color: white;
    }
  </style>
</head>
<body>
  <table bgcolor="#f6f6ef">
    <tr>
      <td class="header" bgcolor="#ff6600">HTML bgcolor</td>
      <td class="css-override" bgcolor="#ff6600">CSS override</td>
    </tr>
    <tr>
      <td>Inherited table fill</td>
      <td bgcolor="#d9edf7">Cell fill</td>
    </tr>
  </table>
</body>
</html>
