<!doctype html>
<meta charset="utf-8">
<title>Radiant table caption box width</title>
<style>
body {
  margin: 0;
  font: 16px Arial, sans-serif;
}
table {
  width: 260px;
  margin: 20px;
  padding: 8px;
  border: 3px solid #333;
  border-collapse: separate;
  border-spacing: 4px;
}
caption {
  caption-side: top;
  padding: 6px 12px;
  border: 2px solid #8c5b25;
  background: #fff4bf;
}
td {
  padding: 5px 9px;
  border: 1px solid #376b8f;
}
</style>
<table>
  <caption>Caption box width</caption>
  <tr><td>alpha</td><td>beta beta</td></tr>
  <tr><td colspan="2">wide cell</td></tr>
</table>
