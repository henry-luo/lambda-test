<!doctype html>
<meta charset="utf-8">
<title>Radiant box model minmax negative clamp</title>
<style>
body {
  margin: 0;
  font: 16px Arial, sans-serif;
}
.stage {
  width: 320px;
  padding: 10px;
}
.border-box {
  width: 18px;
  min-width: 42px;
  max-width: 42px;
  height: 18px;
  margin: 8px 0;
  padding: 6px;
  border: 4px solid #314f6b;
  box-sizing: border-box;
  background: #d9ecff;
}
.content-box {
  width: 60px;
  min-width: 80px;
  max-width: 80px;
  height: 14px;
  margin: 8px 0;
  padding: 5px 7px;
  border: 3px solid #8c5b25;
  box-sizing: content-box;
  background: #fff4bf;
}
.negative-content {
  width: 10px;
  min-width: 0;
  max-width: 10px;
  height: 20px;
  margin: 8px 0;
  padding: 12px 16px;
  border: 5px solid #333;
  box-sizing: border-box;
  background: #f6d1d8;
}
</style>
<div class="stage">
  <div class="border-box"></div>
  <div class="content-box"></div>
  <div class="negative-content"></div>
</div>
