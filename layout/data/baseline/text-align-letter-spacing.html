<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Text alignment with letter spacing</title>
    <style>
        * { margin: 0; padding: 0; }
        div {
            width: 400px;
            font: 20px Arial, sans-serif;
            letter-spacing: 12px;
        }
        .right { text-align: right; }
        .center { text-align: center; }
    </style>
</head>
<body>
    <div class="right">tracked</div>
    <div class="center">tracked</div>
</body>
</html>
