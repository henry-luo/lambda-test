<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>table cell replaced spacer height</title>
<style>
body { margin: 0; }
table { border-collapse: collapse; border-spacing: 0; }
td { padding: 0; }
img { display: block; background: #319795; }
</style>
</head>
<body>
<table>
  <tr><td><img width="1" height="5" alt=""></td></tr>
  <tr><td><img width="80" height="9" alt=""></td></tr>
</table>
</body>
</html>
