<!doctype html>
<meta charset="utf-8">
<title>Radiant containing block percent nested flex grid</title>
<style>
body {
  margin: 0;
  font: 16px Arial, sans-serif;
}
.outer {
  width: 360px;
  height: 180px;
  padding: 20px;
  border: 5px solid #333;
  box-sizing: content-box;
}
.flex {
  display: flex;
  width: 240px;
  height: 120px;
  padding: 10px;
  border: 2px solid #376b8f;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 54px;
  width: 160px;
  height: 70px;
  padding: 5px;
  border: 3px solid #8c5b25;
  box-sizing: border-box;
}
.item {
  width: 50%;
  height: 50%;
  background: #91c7ed;
}
</style>
<div class="outer">
  <div class="flex">
    <div class="grid">
      <div class="item"></div>
      <div class="item"></div>
    </div>
  </div>
</div>
