<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bootstrap Progress Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page bs-container">
    <h1 class="fixture-title">Bootstrap Progress</h1>
    <section class="fixture-stack" id="bootstrap-progress">
      <div class="bs-progress"><div class="bs-progress-bar" data-fixture-width="35%"></div></div>
      <div class="bs-progress"><div class="bs-progress-bar" data-fixture-width="70%" style="background:#198754"></div></div>
    </section>
  </main>
</body>
</html>
