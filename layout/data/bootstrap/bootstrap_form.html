<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bootstrap Form Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page bs-container">
    <h1 class="fixture-title">Bootstrap Form</h1>
    <form class="bs-form" id="bootstrap-form">
      <label class="bs-label" for="bs-email">Email address</label>
      <input class="bs-input" id="bs-email" value="layout@example.test">
      <label class="bs-label" for="bs-role">Role</label>
      <select class="bs-select" id="bs-role">
        <option>Maintainer</option>
      </select>
      <label class="bs-check"><input type="checkbox" checked> Remember this device</label>
      <button class="bs-btn" type="button">Submit</button>
    </form>
  </main>
</body>
</html>
