<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bootstrap Combo Dashboard Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page bs-container">
    <h1 class="fixture-title">Bootstrap Combo Dashboard</h1>
    <div class="fixture-stack" id="bootstrap-combo">
      <nav class="bs-navbar">
        <a class="brand" href="#">Lambda UI</a>
        <a href="#">Overview</a>
        <a href="#">Builds</a>
        <a href="#">Teams</a>
      </nav>
      <div class="bs-alert">Layout references are ready for this Bootstrap component mix.</div>
      <section class="fixture-row">
        <article class="bs-card">
          <div class="bs-card-header">Browser Capture</div>
          <div class="bs-card-body">
            <p class="muted">Cards and buttons sit next to a form to exercise flex wrapping.</p>
            <button class="bs-btn success">Captured</button>
          </div>
        </article>
        <form class="bs-form">
          <label class="bs-label" for="bs-combo-name">Suite name</label>
          <input class="bs-input" id="bs-combo-name" value="bootstrap">
          <label class="bs-check"><input type="checkbox" checked> Include combo page</label>
          <button class="bs-btn" type="button">Save</button>
        </form>
      </section>
      <table class="bs-table">
        <tbody>
          <tr><td>Buttons</td><td>4 variants</td></tr>
          <tr><td>Forms</td><td>Inputs and checks</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
