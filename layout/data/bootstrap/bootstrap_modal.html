<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bootstrap Modal Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page bs-container">
    <h1 class="fixture-title">Bootstrap Modal</h1>
    <section class="bs-modal" id="bootstrap-modal">
      <div class="bs-modal-header fw-700">Modal title</div>
      <div class="bs-modal-body">
        <p>Static modal content tests body padding and footer alignment.</p>
      </div>
      <div class="bs-modal-footer">
        <button class="bs-btn secondary">Close</button>
        <button class="bs-btn">Save</button>
      </div>
    </section>
  </main>
</body>
</html>
