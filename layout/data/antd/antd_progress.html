<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AntD Progress Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">AntD Progress</h1>
    <section class="fixture-stack" id="antd-progress">
      <div class="ant-progress"><div class="ant-progress-bar" data-fixture-width="40%"></div></div>
      <div class="ant-progress"><div class="ant-progress-bar" data-fixture-width="78%" style="background:#52c41a"></div></div>
    </section>
  </main>
</body>
</html>
