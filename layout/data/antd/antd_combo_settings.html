<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AntD Combo Settings Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">AntD Combo Settings</h1>
    <ol class="ant-breadcrumb">
      <li>Home</li><li>/</li><li class="fw-600">Settings</li>
    </ol>
    <section class="fixture-row" style="margin-top:18px" id="antd-combo-settings">
      <form class="ant-form">
        <div class="ant-form-item">
          <label class="ant-form-label" for="antd-combo-email">Email</label>
          <input class="ant-input" id="antd-combo-email" value="antd@example.test">
        </div>
        <div class="ant-form-item">
          <span class="ant-form-label"></span>
          <button class="ant-btn ant-btn-primary" type="button">Save</button>
        </div>
      </form>
      <article class="ant-card">
        <div class="ant-card-head">Capture status</div>
        <div class="ant-card-body">
          <div class="ant-progress"><div class="ant-progress-bar" data-fixture-width="90%"></div></div>
          <p><span class="ant-tag">20 pages</span></p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
