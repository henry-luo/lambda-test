<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AntD Modal Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">AntD Modal</h1>
    <section class="ant-modal-mask" id="antd-modal">
      <div class="ant-modal">
        <div class="ant-modal-header">Confirm capture</div>
        <div class="ant-modal-body">
          <p>Browser reference extraction will include modal mask, dialog, footer, and buttons.</p>
        </div>
        <div class="ant-modal-footer">
          <button class="ant-btn">Cancel</button>
          <button class="ant-btn ant-btn-primary">OK</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
