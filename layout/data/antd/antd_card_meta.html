<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AntD Card Meta Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">AntD Card Meta</h1>
    <article class="ant-card" id="antd-card-meta">
      <div class="ant-card-body">
        <div class="ant-list-meta">
          <span class="ant-avatar">M</span>
          <div>
            <p class="fw-600">Meta title</p>
            <p class="muted">Description text wraps beside the avatar.</p>
          </div>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
