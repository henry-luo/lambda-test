<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AntD Time Picker Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">AntD Time Picker</h1>
    <section id="antd-time-picker">
      <div class="ant-date-picker">09:30:00</div>
      <div class="ant-picker-panel">
        <div class="ant-picker-grid">
          <span>08</span><span>09</span><span>30</span><span>45</span>
          <span>10</span><span>11</span><span>00</span><span>15</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
