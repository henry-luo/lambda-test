<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AntD Form Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">AntD Form</h1>
    <form class="ant-form" id="antd-form">
      <div class="ant-form-item">
        <label class="ant-form-label" for="antd-user">Username</label>
        <input class="ant-input" id="antd-user" value="layout-admin">
      </div>
      <div class="ant-form-item">
        <label class="ant-form-label" for="antd-team">Team</label>
        <select class="ant-select" id="antd-team"><option>Runtime</option></select>
      </div>
      <div class="ant-form-item">
        <span class="ant-form-label"></span>
        <button class="ant-btn ant-btn-primary" type="button">Submit</button>
      </div>
    </form>
  </main>
</body>
</html>
