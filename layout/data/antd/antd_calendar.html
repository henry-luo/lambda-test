<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AntD Calendar Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">AntD Calendar</h1>
    <section class="ant-calendar" id="antd-calendar">
      <div class="ant-calendar-head">July 2026</div>
      <div class="ant-calendar-grid">
        <div class="ant-calendar-cell">Sun</div><div class="ant-calendar-cell">Mon</div><div class="ant-calendar-cell">Tue</div><div class="ant-calendar-cell">Wed</div><div class="ant-calendar-cell">Thu</div><div class="ant-calendar-cell">Fri</div><div class="ant-calendar-cell">Sat</div>
        <div class="ant-calendar-cell">28</div><div class="ant-calendar-cell">29</div><div class="ant-calendar-cell">30</div><div class="ant-calendar-cell">1</div><div class="ant-calendar-cell">2</div><div class="ant-calendar-cell">3</div><div class="ant-calendar-cell">4</div>
        <div class="ant-calendar-cell">5</div><div class="ant-calendar-cell">6</div><div class="ant-calendar-cell">7</div><div class="ant-calendar-cell">8</div><div class="ant-calendar-cell">9</div><div class="ant-calendar-cell fw-700">10</div><div class="ant-calendar-cell">11</div>
      </div>
    </section>
  </main>
</body>
</html>
