<!DOCTYPE html>
<html lang="en">
<head>

  <title>AntD Combo Analytics Detail Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">AntD Combo Analytics Detail</h1>

        <div class="ant-statistic"><p>Pass Rate</p><div class="ant-statistic-value">100%</div></div>

      <div class="ant-alert">All AntD references are available for comparison.</div>
    </section>
  </main>
</body>
</html>
