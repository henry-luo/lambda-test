<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AntD Popconfirm Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">AntD Popconfirm</h1>
    <section class="ant-popconfirm" id="antd-popconfirm">
      <p class="fw-600">Delete this task?</p>
      <p class="muted">This action cannot be undone.</p>
      <button class="ant-btn">No</button>
      <button class="ant-btn ant-btn-primary">Yes</button>
    </section>
  </main>
</body>
</html>
