<!DOCTYPE html>
<!-- Local adaptation: relative sources cover SVG/canvas orientation; HTTP origin policy belongs to the upstream WPT. -->
<html class="reftest-wait">
<head>
<meta charset="utf-8">
<title>CSS Images: local image-orientation for static and dynamic SVG content</title>
<link rel="author" title="Stephen Chenney" href="mailto:schenney@chromium.org">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/5165">
<style>
    .image {
        width: 40px;
        height: 20px;
        position: fixed;
    }
</style>
<script>
    window.onload = () => {
        const images = [
            {
                id_image: "dynamic_from_image",
                id_foreign: "dynamic_from_foreign",
                dynamic: true,
                orientation: 'from-image',
                shouldBeRotated: true,
                left: '10px'
            },
            {
                id_image: "dynamic_none_image",
                id_foreign: "dynamic_none_foreign",
                dynamic: true,
                orientation: 'none',
                shouldBeRotated: false,
                left: '60px'
            },
            {
                id_image: "static_from_image",
                id_foreign: "static_from_foreign",
                dynamic: false,
                orientation: 'from-image',
                shouldBeRotated: true,
                left: '110px'
            },
            {
                id_image: "static_none_image",
                id_foreign: "static_none_foreign",
                dynamic: false,
                orientation: 'none',
                shouldBeRotated: false,
                left: '160px'
            },
        ];

        images.forEach(data => {
            const image = document.getElementById(data.id_image);
            const foreign = document.getElementById(data.id_foreign);
            if (data.dynamic) {
                const source = "support/exif-orientation-3-lr.jpg";
                image.setAttribute("href", source);
                foreign.src = source;
            }

            const canvas_svg_image = document.createElement('canvas');
            canvas_svg_image.className = "image";
            canvas_svg_image.width = canvas_svg_image.height = 1;
            canvas_svg_image.style.left = data.left;
            canvas_svg_image.style.top = "140px";
            // The source of image-orientation preference for canvas drawImage
            // is currently not standardized.
            // See https://github.com/w3c/csswg-drafts/issues/4666
            canvas_svg_image.style.imageOrientation = data.orientation;
            document.body.appendChild(canvas_svg_image);
            let ctx = canvas_svg_image.getContext('2d');
            const sx = data.shouldBeRotated ? 80 : 0;
            const sy = data.shouldBeRotated ? 40 : 0;
            ctx.drawImage(image, sx, sy, 1, 1, 0, 0, 1, 1);

            const canvas_svg_foreign = document.createElement('canvas');
            canvas_svg_foreign.className = "image";
            canvas_svg_foreign.width = canvas_svg_foreign.height = 1;
            canvas_svg_foreign.style.left = data.left;
            canvas_svg_foreign.style.top = "170px";
            canvas_svg_foreign.style.imageOrientation = data.orientation;
            document.body.appendChild(canvas_svg_foreign);
            ctx = canvas_svg_foreign.getContext('2d');
            ctx.drawImage(foreign, sx, sy, 1, 1, 0, 0, 1, 1);
        })
        // publish the local SVG/canvas mutations before the reference snapshot.
        requestAnimationFrame(() => document.documentElement.classList.remove('reftest-wait'));
    }

</script>
</head>
<body>
    <svg class="image" id="svg_dynamic_from" style="left: 10px; top: 50px; image-orientation: from-image;">
        <image id="dynamic_from_image" href="support/exif-orientation-3-lr.jpg" X="-57" Y="-27"></image>
    </svg>
    <!-- This should be functionally identical to a plain <img> element. We test it here to verify
         that SVG foreign object retains local image orientation. -->
    <svg class="image" style="left: 10px; top: 80px; image-orientation: from-image;">
        <foreignObject  x="-57" y="-27" width="100" height="50">
            <img id="dynamic_from_foreign" src="support/exif-orientation-3-lr.jpg"></img>
        </foreignObject>
    </svg>
    <!-- Note SVG-as-image requires any <image> elements to use (base64 encoded) data: URLs, that can
         never be cross origin. This just tests that we don't crash or do other strange things. -->
    <img class="image" id="img_dynamic_from" src="support/svg-with-image-rotated.svg" style="left: 10px; top: 110px; image-orientation: from-image;"/>

    <svg class="image" style="left: 60px; top: 50px; image-orientation: none;">
        <image id="dynamic_none_image" href="support/exif-orientation-3-lr.jpg" X="0" Y="0"></image>
    </svg>
    <!-- This should be functionally identical to a plain <img> element. We test it here to verify
         that SVG foreign object retains local image orientation. -->
    <svg class="image" style="left: 60px; top: 80px; image-orientation: none;">
        <foreignObject x="0" y="0" width="100" height="50">
            <img id="dynamic_none_foreign" src="support/exif-orientation-3-lr.jpg"></img>
        </foreignObject>
    </svg>
    <!-- Note SVG-as-image requires any <image> elements to use (base64 encoded) data: URLs, that can
         never be cross origin. This just tests that we don't crash or do other strange things. -->
    <img class="image" id="img_dynamic_none" src="support/svg-with-image-rotated.svg" style="left: 60px; top: 110px; image-orientation: none;"/>

    <svg class="image" style="left: 110px; top: 50px; image-orientation: from-image;">
        <image id="static_from_image" href="support/exif-orientation-3-lr.jpg" X="-57" Y="-27"></image>
    </svg>
    <!-- This should be functionally identical to a plain <img> element. We test it here to verify
         that SVG foreign object retains local image orientation. -->
    <svg class="image" style="left: 110px; top: 80px; image-orientation: from-image;">
        <foreignObject  x="-57" y="-27" width="100" height="50">
            <img id="static_from_foreign" src="support/exif-orientation-3-lr.jpg"></img>
        </foreignObject>
    </svg>
    <!-- Note SVG-as-image requires any <image> elements to use (base64 encoded) data: URLs, that can
         never be cross origin. This just tests that we don't crash or do other strange things. -->
    <img class="image" id="img_static_from" src="support/svg-with-image-rotated.svg" style="left: 110px; top: 110px; image-orientation: from-image;"/>

    <svg class="image" style="left: 160px; top: 50px; image-orientation: none;">
        <image id="static_none_image" href="support/exif-orientation-3-lr.jpg" X="0" Y="0"></image>
    </svg>
    <!-- This should be functionally identical to a plain <img> element. We test it here to verify
         that SVG foreign object retains local image orientation. -->
    <svg class="image" style="left: 160px; top: 80px; image-orientation: none;">
        <foreignObject x="0" y="0" width="100" height="50">
            <img id="static_none_foreign" src="support/exif-orientation-3-lr.jpg"></img>
        </foreignObject>
    </svg>
    <!-- Note SVG-as-image requires any <image> elements to use (base64 encoded) data: URLs, that can
         never be cross origin. This just tests that we don't crash or do other strange things. -->
    <img class="image" id="img_static_none" src="support/svg-with-image-rotated.svg" style="left: 160px; top: 110px; image-orientation: none;"/>

</body>
</html>
