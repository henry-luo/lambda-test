<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailwind Badge Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">Tailwind Badge</h1>
    <section class="tw-flex tw-gap-3" id="tailwind-badge">
      <span class="tw-badge">Active</span>
      <span class="tw-badge" style="background:#dbeafe;color:#1d4ed8">Info</span>
      <span class="tw-badge" style="background:#fef3c7;color:#92400e">Pending</span>
      <span class="tw-badge" style="background:#fee2e2;color:#991b1b">Blocked</span>
    </section>
  </main>
</body>
</html>
