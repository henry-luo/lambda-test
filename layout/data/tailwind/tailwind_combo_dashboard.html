<!DOCTYPE html>
<html lang="en">
<head>

  <main class="fixture-page">

      <img src="../support/images/component-panel.svg" alt="" width="128" height="88">

    <form class="tw-bg-white tw-border tw-rounded tw-p-4 tw-flex tw-gap-3" style="margin-top: 18px">
      <input class="tw-input" value="tailwind">
      <button class="tw-btn" type="button">Capture</button>
