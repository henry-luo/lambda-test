<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailwind Card Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">Tailwind Card</h1>
    <article class="tw-card" id="tailwind-card">
      <img src="../support/images/component-panel.svg" alt="" width="300" height="206">
      <div class="tw-card-body">
        <div class="tw-badge tw-mb-2">Utility</div>
        <p class="fw-700 tw-mb-2">Composable component card</p>
        <p class="tw-text-muted">This fixture covers image sizing, shadows, borders, and stacked utility spacing.</p>
      </div>
    </article>
  </main>
</body>
</html>
