<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailwind Form Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">Tailwind Form</h1>
    <form class="tw-bg-white tw-border tw-rounded tw-shadow tw-p-6 fixture-stack" id="tailwind-form" style="width: 430px">
      <label class="fw-600" for="tw-name">Project</label>
      <input class="tw-input" id="tw-name" value="Layout capture">
      <label class="fw-600" for="tw-slug">Slug</label>
      <input class="tw-input" id="tw-slug" value="tailwind-suite">
      <button class="tw-btn" type="button">Create</button>
    </form>
  </main>
</body>
</html>
