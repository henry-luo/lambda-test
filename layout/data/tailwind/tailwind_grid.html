<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailwind Grid Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">Tailwind Grid</h1>
    <section class="tw-grid tw-grid-3 tw-gap-3" id="tailwind-grid">
      <div class="tw-stat"><span class="tw-text-muted">Tests</span><p class="fw-700">18</p></div>
      <div class="tw-stat"><span class="tw-text-muted">Suites</span><p class="fw-700">3</p></div>
      <div class="tw-stat"><span class="tw-text-muted">Refs</span><p class="fw-700">Ready</p></div>
      <div class="tw-stat"><span class="tw-text-muted">Viewport</span><p class="fw-700">1200 x 800</p></div>
      <div class="tw-stat"><span class="tw-text-muted">Mode</span><p class="fw-700">Static</p></div>
      <div class="tw-stat"><span class="tw-text-muted">CSS</span><p class="fw-700">Local</p></div>
    </section>
  </main>
</body>
</html>
