<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailwind Progress Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">Tailwind Progress</h1>
    <section class="fixture-stack" id="tailwind-progress">
      <div class="tw-progress"><div class="tw-progress-bar" data-fixture-width="45%"></div></div>
      <div class="tw-progress"><div class="tw-progress-bar tw-bg-emerald" data-fixture-width="82%"></div></div>
    </section>
  </main>
</body>
</html>
