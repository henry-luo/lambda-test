<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tailwind Calendar Fixture</title>
  <link rel="stylesheet" href="../support/framework-fixtures.css">
  <script defer src="../support/framework-fixtures.js"></script>
</head>
<body>
  <main class="fixture-page">
    <h1 class="fixture-title">Tailwind Calendar</h1>
    <section class="tw-calendar" id="tailwind-calendar">
      <div class="tw-calendar-head">July 2026</div>
      <div class="tw-calendar-grid">
        <div class="tw-calendar-day">10</div><div class="tw-calendar-day">11</div><div class="tw-calendar-day">12</div><div class="tw-calendar-day">13</div><div class="tw-calendar-day">14</div><div class="tw-calendar-day">15</div><div class="tw-calendar-day">16</div>
        <div class="tw-calendar-day">17</div><div class="tw-calendar-day">18</div><div class="tw-calendar-day">19</div><div class="tw-calendar-day">20</div><div class="tw-calendar-day">21</div><div class="tw-calendar-day">22</div><div class="tw-calendar-day">23</div>
      </div>
    </section>
  </main>
</body>
</html>
