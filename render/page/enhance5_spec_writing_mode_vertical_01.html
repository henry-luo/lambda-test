<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 170px; height: 130px; overflow: hidden; }
  body { background: #f8fafc; font: 700 18px Arial, sans-serif; color: #172554; }
  .panel {
    position: absolute; left: 28px; top: 14px;
    width: 112px; height: 102px;
    border: 3px solid #334155;
    background: #dbeafe;
  }
  .vertical {
    position: absolute; right: 18px; top: 12px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    line-height: 1.1;
    background: rgba(34, 197, 94, 0.25);
    padding: 4px;
  }
  .latin {
    color: #f97316;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="vertical">AB<span class="latin">12</span>CD</div>
  </div>
</body>
</html>
