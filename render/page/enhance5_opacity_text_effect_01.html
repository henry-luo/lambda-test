<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 140px; height: 120px; overflow: hidden; }
  body { background: #f7f8fb; font: 700 18px Arial, sans-serif; }
  .back {
    position: absolute; left: 8px; top: 8px;
    width: 124px; height: 104px;
    background: linear-gradient(135deg, #d7eef4 0%, #f7d8c8 100%);
  }
  .group {
    position: absolute; left: 20px; top: 18px;
    width: 92px; height: 76px;
    opacity: 0.62;
    background: #145f75;
    border: 5px solid #f2b84b;
    border-radius: 14px;
    box-shadow: 0 8px 10px rgba(32, 40, 50, 0.28);
  }
  .child {
    position: absolute; left: 16px; top: 18px;
    width: 56px; height: 32px;
    background: #e84545;
    color: white;
    line-height: 32px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="back"></div>
  <div class="group">
    <div class="child">Aa</div>
  </div>
</body>
</html>
