<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 120px; height: 120px; overflow: hidden; }
  body { background: white; font-size: 12px; font-family: sans-serif; }
  .indent {
    text-indent: 24px;
    width: 96px;
    margin: 6px 12px;
    background: #ecf0f1;
    padding: 3.6px;
  }
  .nowrap {
    white-space: nowrap;
    width: 96px;
    margin: 6px 12px;
    background: #ecf0f1;
    padding: 3.6px;
    overflow: hidden;
  }
  .pre {
    white-space: pre;
    width: 96px;
    margin: 6px 12px;
    background: #ecf0f1;
    padding: 3.6px;
    overflow: hidden;
    font-family: monospace;
    font-size: 10.8px;
  }
</style>
</head>
<body>
  <div class="indent">indented text here flows</div>
  <div class="nowrap">no wrap long text here</div>
  <div class="pre">pre  spaced
  two</div>
</body>
</html>
