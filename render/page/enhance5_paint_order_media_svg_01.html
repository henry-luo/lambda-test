<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 160px; height: 120px; overflow: hidden; }
  body { background: #f8fafc; font: 700 16px Arial, sans-serif; }
  .card {
    position: absolute; left: 14px; top: 12px;
    width: 130px; height: 90px;
    background: linear-gradient(135deg, #fef3c7, #bfdbfe);
    border: 7px solid #1f2937;
    border-radius: 14px;
    overflow: hidden;
  }
  img {
    position: absolute; left: 8px; top: 16px;
    width: 52px; height: 52px;
    object-fit: cover;
  }
  svg {
    position: absolute; left: 49px; top: 20px;
    width: 54px; height: 46px;
  }
  .label {
    position: absolute; left: 66px; top: 55px;
    color: #111827;
    text-shadow: 1px 1px 0 #ffffff;
  }
</style>
</head>
<body>
  <div class="card">
    <img alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAQCAYAAAB3AH1ZAAAAY0lEQVR4nGN87mPzn4EC4OsznxLtDEwMAwyYRrwDWMjVKLH5MJg+DeWbzrxDvxCQgFqODE6nq9DHARJYLKfEEUwMAwyYRh3AQCJ44WuLU46cnMBEsg4cjiA3GzKO1gUMI90BALsxF3CC7Y+eAAAAAElFTkSuQmCC">
    <svg viewBox="0 0 54 46">
      <rect x="4" y="5" width="40" height="30" rx="7" fill="#22c55e" opacity="0.75"/>
      <circle cx="35" cy="24" r="15" fill="#ef4444" opacity="0.72"/>
    </svg>
    <div class="label">order</div>
  </div>
</body>
</html>
