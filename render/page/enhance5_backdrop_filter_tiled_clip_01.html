<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 340px; height: 160px; overflow: hidden; }
  body { background: white; }
  .scene {
    position: absolute; left: 198px; top: 24px;
    width: 124px; height: 106px;
    background:
      linear-gradient(135deg, #ef4444, #3b82f6),
      repeating-linear-gradient(90deg, transparent 0 8px, rgba(255,255,255,0.35) 8px 16px);
  }
  .pane {
    position: absolute; left: 26px; top: 22px;
    width: 70px; height: 58px;
    border: 3px solid rgba(255,255,255,0.58);
    border-radius: 16px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(4px);
    clip-path: inset(3px 5px 5px 3px round 12px);
  }
  .mark {
    position: absolute; left: 17px; top: 17px;
    width: 36px; height: 22px;
    border-radius: 999px;
    background: rgba(34, 197, 94, 0.72);
  }
</style>
</head>
<body>
  <div class="scene"><div class="pane"><div class="mark"></div></div></div>
</body>
</html>
