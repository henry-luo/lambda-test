<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 130px; height: 120px; overflow: hidden; }
  body { background: #f1f5f9; }
  .root {
    position: absolute; left: 14px; top: 13px;
    width: 100px; height: 92px;
    background: #e2e8f0;
    isolation: isolate;
  }
  .box { position: absolute; width: 58px; height: 58px; border-radius: 10px; }
  .a { left: 13px; top: 12px; background: #ef4444; z-index: 1; }
  .b { left: 29px; top: 25px; background: #22c55e; opacity: 0.66; z-index: 3; }
  .c { left: 45px; top: 8px; background: #3b82f6; z-index: 2; mix-blend-mode: multiply; }
</style>
</head>
<body>
  <div class="root">
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box c"></div>
  </div>
</body>
</html>
