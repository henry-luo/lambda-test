<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 140px; height: 120px; overflow: hidden; }
  body { background: white; }
  .box {
    position: absolute; left: 16px; top: 14px;
    width: 108px; height: 88px;
    border: 8px solid rgba(30, 41, 59, 0.9);
    border-radius: 20px;
    background:
      linear-gradient(45deg, transparent 35%, rgba(250, 204, 21, 0.95) 35%, rgba(250, 204, 21, 0.95) 60%, transparent 60%),
      linear-gradient(-35deg, transparent 32%, rgba(56, 189, 248, 0.85) 32%, rgba(56, 189, 248, 0.85) 58%, transparent 58%),
      #86efac;
    background-clip: padding-box;
    padding: 10px;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
