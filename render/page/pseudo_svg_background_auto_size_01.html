<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 180px;
    height: 120px;
    margin: 0;
    overflow: hidden;
    background: white;
  }
  body {
    padding: 18px 20px;
    font-family: Georgia, serif;
  }
  h1 {
    margin: 0;
    font-size: 24px;
    line-height: 50px;
  }
  h1::before {
    content: "";
    display: inline-block;
    width: 46px;
    height: 50px;
    margin-right: 8px;
    vertical-align: middle;
    background-image: url("res/pseudo_svg_logo.svg");
    background-repeat: no-repeat;
  }
</style>
</head>
<body>
  <h1>logo</h1>
</body>
</html>
