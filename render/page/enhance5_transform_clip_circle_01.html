<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 120px; height: 120px; overflow: hidden; }
  body { background: #fdfdfb; }
  .clip {
    position: absolute; left: 16px; top: 14px;
    width: 88px; height: 88px;
    background: #dbeafe;
    clip-path: circle(42% at 50% 50%);
  }
  .child {
    position: absolute; left: 18px; top: 21px;
    width: 66px; height: 42px;
    border: 7px solid #7c3aed;
    background: linear-gradient(90deg, #34d399, #60a5fa);
    transform: rotate(25deg) translate(4px, -2px);
    transform-origin: 50% 50%;
  }
</style>
</head>
<body>
  <div class="clip"><div class="child"></div></div>
</body>
</html>
