<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 140px; height: 120px; overflow: hidden; }
  body { background: #fff; font: 700 15px Arial, sans-serif; }
  .card {
    position: absolute; left: 14px; top: 14px;
    width: 112px; height: 86px;
    border: 5px solid #0f766e;
    border-radius: 18px;
    overflow: hidden;
    background: #ccfbf1;
  }
  img {
    position: absolute; left: -10px; top: -8px;
    width: 76px; height: 76px;
    object-fit: cover;
  }
  .text {
    position: absolute; left: 45px; top: 24px;
    width: 78px;
    color: #134e4a;
    line-height: 18px;
  }
</style>
</head>
<body>
  <div class="card">
    <img alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAQCAYAAAB3AH1ZAAAAY0lEQVR4nGN87mPzn4EC4OsznxLtDEwMAwyYRrwDWMjVKLH5MJg+DeWbzrxDvxCQgFqODE6nq9DHARJYLKfEEUwMAwyYRh3AQCJ44WuLU46cnMBEsg4cjiA3GzKO1gUMI90BALsxF3CC7Y+eAAAAAElFTkSuQmCC">
    <div class="text">rounded clip text</div>
  </div>
</body>
</html>
