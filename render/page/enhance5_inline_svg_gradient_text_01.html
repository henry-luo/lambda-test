<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 150px; height: 120px; overflow: hidden; }
  body { background: #fdfcf8; }
  svg {
    position: absolute; left: 14px; top: 14px;
    width: 120px; height: 86px;
  }
</style>
</head>
<body>
  <svg viewBox="0 0 120 86">
    <defs>
      <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#06b6d4"/>
        <stop offset="1" stop-color="#f97316"/>
      </linearGradient>
    </defs>
    <g transform="translate(11 8) rotate(8 49 33)">
      <rect x="0" y="0" width="98" height="62" rx="12" fill="url(#paint)"/>
      <circle cx="72" cy="22" r="15" fill="#ffffff" opacity="0.45"/>
      <text x="15" y="42" font-family="Arial" font-size="22" font-weight="700" fill="#1f2937">SVG</text>
    </g>
  </svg>
</body>
</html>
