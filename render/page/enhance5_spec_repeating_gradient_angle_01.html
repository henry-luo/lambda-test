<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 150px; height: 120px; overflow: hidden; }
  body { background: #f8fafc; }
  .box {
    position: absolute; left: 22px; top: 14px;
    width: 106px; height: 90px;
    border: 5px solid #334155;
    border-radius: 20px;
    overflow: hidden;
    background: repeating-linear-gradient(
      135deg,
      #38bdf8 0 11px,
      #fef08a 11px 22px,
      #fb7185 22px 33px
    );
  }
  .inner {
    position: absolute; left: 27px; top: 24px;
    width: 52px; height: 34px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.76);
    border: 2px solid rgba(15, 23, 42, 0.45);
  }
</style>
</head>
<body>
  <div class="box"><div class="inner"></div></div>
</body>
</html>
