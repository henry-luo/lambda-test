<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 170px; height: 120px; overflow: hidden; }
  body { background: #f8fafc; }
  .stage {
    position: absolute; left: 18px; top: 14px;
    width: 134px; height: 92px;
    border: 3px solid #334155;
    background: #dbeafe;
    overflow: hidden;
  }
  img {
    position: absolute; left: 12px; top: 13px;
    width: 74px; height: 54px;
  }
  .overlay {
    position: absolute; left: 58px; top: 38px;
    width: 56px; height: 32px;
    border-radius: 10px;
    background: rgba(249, 115, 22, 0.82);
    border: 3px solid rgba(15, 23, 42, 0.62);
  }
  .dot {
    position: absolute; left: 98px; top: 16px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #22c55e;
  }
</style>
</head>
<body>
  <div class="stage">
    <img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 60'%3E%3Crect width='80' height='60' rx='10' fill='%232563eb'/%3E%3Ccircle cx='24' cy='22' r='14' fill='%23fef08a'/%3E%3Cpath d='M10 48 L68 12' stroke='%23ffffff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
    <div class="overlay"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
