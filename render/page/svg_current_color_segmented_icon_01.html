<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 140px;
    height: 80px;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .segments {
    display: flex;
    border: 1px solid #3689e6;
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
  }
  .segment {
    width: 42px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #3689e6;
  }
  .segment.active {
    color: #fff;
    background: #3689e6;
  }
  .segment + .segment {
    border-left: 1px solid #3689e6;
  }
  svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
  <div class="segments">
    <div class="segment active">
      <svg viewBox="0 0 24 24" stroke="currentColor">
        <path d="M4 7h16"></path>
        <path d="M4 12h16"></path>
        <path d="M4 17h16"></path>
      </svg>
    </div>
    <div class="segment">
      <svg viewBox="0 0 24 24" stroke="currentColor">
        <path d="M5 5h14v14H5z"></path>
        <path d="M9 9h6"></path>
        <path d="M9 13h6"></path>
      </svg>
    </div>
  </div>
</body>
</html>
