<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 160px; height: 100px; overflow: hidden; }
  body { background: #fafafa; font: 700 28px Arial, sans-serif; color: #1f2937; }
  .label {
    position: absolute; left: 12px; top: 28px;
    text-decoration-line: underline;
    text-decoration-thickness: 3px;
    text-decoration-color: #dc2626;
    text-underline-offset: 2px;
    text-decoration-skip-ink: auto;
    text-shadow: 3px 3px 5px rgba(37, 99, 235, 0.45);
  }
</style>
</head>
<body>
  <div class="label">gypq</div>
</body>
</html>
