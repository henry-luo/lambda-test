<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 140px; height: 120px; overflow: hidden; }
  body { background: linear-gradient(135deg, #f8fafc, #e2e8f0); }
  .outer {
    position: absolute; left: 16px; top: 16px;
    width: 108px; height: 84px;
    background: #f97316;
    opacity: 0.82;
    border-radius: 16px;
    filter: saturate(1.35);
  }
  .inner {
    position: absolute; left: 20px; top: 18px;
    width: 68px; height: 48px;
    background: #2563eb;
    border-radius: 12px;
    mix-blend-mode: multiply;
    box-shadow: 6px 6px 8px rgba(15, 23, 42, 0.28);
  }
</style>
</head>
<body>
  <div class="outer"><div class="inner"></div></div>
</body>
</html>
