<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 170px; height: 125px; overflow: hidden; }
  body { background: #f8fafc; }
  .stage {
    position: absolute; left: 18px; top: 14px;
    width: 134px; height: 96px;
    background: #e2e8f0;
    border: 3px solid #334155;
    border-radius: 8px;
  }
  .back {
    position: absolute; left: 18px; top: 16px;
    width: 78px; height: 54px;
    background: #2563eb;
    opacity: 0.78;
    z-index: 1;
  }
  .mid {
    position: absolute; left: 46px; top: 34px;
    width: 70px; height: 42px;
    border-radius: 12px;
    background: #f97316;
    box-shadow: 8px 8px 0 rgba(15, 23, 42, 0.22);
    transform: rotate(6deg);
    z-index: 2;
  }
  .front {
    position: absolute; left: 84px; top: 18px;
    width: 28px; height: 62px;
    border-radius: 14px;
    background: #22c55e;
    opacity: 0.86;
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="back"></div>
    <div class="mid"></div>
    <div class="front"></div>
  </div>
</body>
</html>
