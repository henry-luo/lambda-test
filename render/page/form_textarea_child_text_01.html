<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 180px; height: 100px; overflow: hidden; }
  body {
    background: white;
    padding: 10px;
    font: 12px Arial, Helvetica, sans-serif;
    color: #202124;
  }
  textarea {
    display: block;
    width: 150px;
    height: 58px;
    padding: 6px;
    border: 1px solid #9aa0a6;
    border-radius: 3px;
    resize: none;
    font: 12px Arial, Helvetica, sans-serif;
    line-height: 16px;
    color: #202124;
    background: #fff;
  }
</style>
</head>
<body>
  <textarea>Alpha beta
Gamma delta</textarea>
</body>
</html>
