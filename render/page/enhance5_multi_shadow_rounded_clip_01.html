<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 150px; height: 120px; overflow: hidden; }
  body { background: #f8fafc; }
  .shadowed {
    position: absolute; left: 28px; top: 22px;
    width: 88px; height: 66px;
    border-radius: 22px 10px 18px 8px;
    border: 5px solid #334155;
    background: linear-gradient(135deg, #fef3c7, #bae6fd);
    box-shadow:
      9px 7px 9px rgba(15, 23, 42, 0.28),
      -7px -5px 8px rgba(14, 165, 233, 0.24),
      inset 6px 5px 8px rgba(180, 83, 9, 0.24);
    overflow: hidden;
  }
  .stripe {
    position: absolute; left: -10px; top: 23px;
    width: 118px; height: 17px;
    background: rgba(239, 68, 68, 0.72);
    transform: rotate(-15deg);
  }
</style>
</head>
<body>
  <div class="shadowed"><div class="stripe"></div></div>
</body>
</html>
