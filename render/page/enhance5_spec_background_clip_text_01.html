<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 190px; height: 120px; overflow: hidden; }
  body { background: #f8fafc; font: 800 34px Arial, sans-serif; }
  .panel {
    position: absolute; left: 14px; top: 18px;
    width: 162px; height: 78px;
    border: 3px solid #334155;
    background: #e2e8f0;
  }
  .text {
    position: absolute; left: 14px; top: 19px;
    background: linear-gradient(90deg, #ef4444, #f97316, #22c55e, #2563eb);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
</style>
</head>
<body>
  <div class="panel"><div class="text">CLIP</div></div>
</body>
</html>
