<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 160px; height: 120px; overflow: hidden; }
  body { background: #fff; font: 700 15px Arial, sans-serif; padding: 12px; }
  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 132px;
    height: 84px;
    background: #f8fafc;
  }
  td {
    position: relative;
    border: 5px solid #0f766e;
    background: linear-gradient(135deg, #ccfbf1, #fde68a);
    border-radius: 10px;
    overflow: hidden;
    color: #134e4a;
    vertical-align: middle;
    text-align: center;
  }
  svg {
    position: absolute; left: 18px; top: 16px;
    width: 46px; height: 38px;
  }
  .label {
    position: relative;
    z-index: 1;
    text-shadow: 1px 1px 0 #fff;
  }
</style>
</head>
<body>
  <table><tr><td>
    <svg viewBox="0 0 46 38">
      <rect x="4" y="5" width="34" height="25" rx="8" fill="#38bdf8" opacity="0.72"/>
      <circle cx="29" cy="20" r="12" fill="#f97316" opacity="0.7"/>
    </svg>
    <span class="label">cell</span>
  </td></tr></table>
</body>
</html>
