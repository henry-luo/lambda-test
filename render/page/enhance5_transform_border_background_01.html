<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 140px; height: 120px; overflow: hidden; }
  body { background: #f9fafb; }
  .layer {
    position: absolute; left: 26px; top: 24px;
    width: 86px; height: 58px;
    background:
      radial-gradient(circle at 28px 22px, #facc15 0 15px, transparent 16px),
      linear-gradient(135deg, #38bdf8, #a78bfa);
    border: 8px solid #334155;
    border-radius: 18px;
    box-shadow: 5px 8px 8px rgba(15, 23, 42, 0.22);
    transform: rotate(-12deg) translate(1px, 4px);
    transform-origin: 50% 50%;
  }
</style>
</head>
<body>
  <div class="layer"></div>
</body>
</html>
