<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 130px; height: 120px; overflow: hidden; }
  body { background: #fbfaf8; font: 16px Arial, sans-serif; }
  .box {
    position: absolute; left: 12px; top: 12px;
    width: 92px;
    color: #1f2937;
    line-height: 24px;
  }
  .mark {
    background: #fde68a;
    border: 2px solid #f59e0b;
    border-radius: 8px;
    padding: 2px 5px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
</style>
</head>
<body>
  <div class="box">
    <span class="mark">wrapped inline background across two lines</span>
  </div>
</body>
</html>
