<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 180px; height: 120px; overflow: hidden; }
  body { background: #fff7ed; font: 16px Arial, sans-serif; }
  .editor {
    position: absolute; left: 18px; top: 18px;
    width: 144px; height: 74px;
    border: 4px solid #9a3412;
    border-radius: 18px;
    background: linear-gradient(135deg, #ffffff, #ffedd5);
    overflow: hidden;
    padding: 13px 12px;
    line-height: 22px;
    transform: rotate(-2deg);
    color: #431407;
  }
  .sel {
    background: rgba(251, 191, 36, 0.85);
  }
  .caret {
    display: inline-block;
    width: 2px;
    height: 20px;
    margin-left: 1px;
    vertical-align: -4px;
    background: #431407;
  }
</style>
</head>
<body>
  <div class="editor">paint <span class="sel">round</span><span class="caret"></span><br>overflow</div>
</body>
</html>
