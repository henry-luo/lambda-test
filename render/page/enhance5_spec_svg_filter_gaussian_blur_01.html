<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 160px; height: 120px; overflow: hidden; }
  body { background: #f8fafc; }
  svg {
    display: block;
    margin: 10px 12px;
    width: 136px; height: 98px;
    background: #e2e8f0;
    border: 3px solid #334155;
  }
</style>
</head>
<body>
  <svg viewBox="0 0 136 98" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
    </defs>
    <circle cx="56" cy="48" r="28" fill="#ef4444" filter="url(#blur)"/>
    <rect x="72" y="28" width="42" height="38" rx="8" fill="#2563eb" opacity="0.85"/>
  </svg>
</body>
</html>
