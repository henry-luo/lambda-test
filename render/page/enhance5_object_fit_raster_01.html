<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 130px; height: 120px; overflow: hidden; }
  body { background: #f8fafc; }
  .frame {
    position: absolute; left: 20px; top: 16px;
    width: 84px; height: 84px;
    border: 6px solid #334155;
    border-radius: 14px;
    overflow: hidden;
    background: #e2e8f0;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 62% 50%;
    display: block;
  }
</style>
</head>
<body>
  <div class="frame">

  </div>
</body>
</html>
