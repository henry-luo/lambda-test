<!DOCTYPE html>
<html>
<head>

<style>

  body { background: #f8fafc; }
  svg {
    display: block;
    margin: 10px 12px;
    width: 136px; height: 98px;
    background: #e2e8f0;
    border: 3px solid #334155;

</style>
</head>

      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f97316"/>
        <stop offset="1" stop-color="#2563eb"/>

    </defs>
    <rect x="12" y="12" width="72" height="48" rx="10" fill="url(#g)" opacity="0.9"/>

          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18" y1="88" x2="118" y2="88"
          stroke="#334155" stroke-width="3" stroke-dasharray="8 5"/>

          stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

</html>
