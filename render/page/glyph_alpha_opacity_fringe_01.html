<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 180px;
    height: 90px;
    overflow: hidden;
  }
  body {
    background:
      linear-gradient(135deg, #466dff 0%, #63b2e5 54%, #f1bf79 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  .panel {
    position: absolute;
    left: 18px;
    top: 16px;
    width: 144px;
    height: 58px;
    opacity: 0.78;
  }
  .title {
    color: white;
    font-size: 31px;
    line-height: 36px;
    font-weight: 800;
    letter-spacing: 0;
  }
  .caption {
    color: white;
    font-size: 13px;
    line-height: 17px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="title">White</div>
    <div class="caption">transparent text edge</div>
  </div>
</body>
</html>
