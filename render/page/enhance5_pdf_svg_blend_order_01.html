<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 176px; height: 132px; overflow: hidden; }
  body { background: #ffffff; font: 700 16px Arial, sans-serif; }
  .stage {
    position: absolute; left: 16px; top: 14px;
    width: 144px; height: 98px;
    border: 6px solid #4c1d95;
    border-radius: 14px;
    background: linear-gradient(135deg, #ede9fe, #fef3c7);
    overflow: hidden;
  }
  .blend {
    position: absolute; left: 20px; top: 22px;
    width: 58px; height: 48px;
    background: #ef4444;
    opacity: 0.75;
    mix-blend-mode: multiply;
  }
  svg {
    position: absolute; left: 52px; top: 20px;
    width: 60px; height: 48px;
  }
  .label {
    position: absolute; left: 43px; top: 52px;
    color: #1f2937;
    text-shadow: 1px 1px 0 #fff;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="blend"></div>
    <svg viewBox="0 0 60 48">
      <rect x="7" y="8" width="38" height="28" rx="8" fill="#38bdf8" opacity="0.78"/>
      <circle cx="39" cy="25" r="14" fill="#f59e0b" opacity="0.76"/>
    </svg>
    <div class="label">blend</div>
  </div>
</body>
</html>
