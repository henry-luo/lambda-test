<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 150px;
    height: 70px;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #f5f5f7;
  }
  .icon-button {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #0f75f5;
    background: #fff;
    border: 3px solid currentColor;
    border-radius: 50%;
  }
  .lime { color: #68b723; }
  .berry { color: #de3e80; }
  svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
  <div class="icon-button">
    <svg viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
  </div>
  <div class="icon-button lime">
    <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
  </div>
  <div class="icon-button berry">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"></path></svg>
  </div>
</body>
</html>
