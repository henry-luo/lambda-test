<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 160px; height: 120px; overflow: hidden; }
  body { background: #f8fafc; }
  svg {
    display: block;
    margin: 10px 12px;
    width: 136px; height: 98px;
    background: #e2e8f0;
    border: 3px solid #334155;
  }
</style>
</head>
<body>
  <svg viewBox="0 0 136 98" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="136" height="98">
        <rect width="136" height="98" fill="black"/>
        <circle cx="54" cy="46" r="32" fill="white"/>
        <rect x="70" y="20" width="46" height="50" rx="10" fill="#888"/>
      </mask>
    </defs>
    <rect x="12" y="12" width="112" height="74" rx="12"
          fill="url(#g)" mask="url(#m)"/>
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ef4444"/>
        <stop offset="1" stop-color="#2563eb"/>
      </linearGradient>
    </defs>
  </svg>
</body>
</html>
