<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 160px; height: 120px; overflow: hidden; }
  body { background: #f8fafc; }
  .box {
    position: absolute; left: 28px; top: 20px;
    width: 104px; height: 78px;
    border: 14px solid transparent;
    border-image-source: linear-gradient(135deg, #ef4444, #fef08a, #2563eb);
    border-image-slice: 1;
    border-image-width: 14px;
    border-image-repeat: stretch;
    background: #dbeafe;
  }
  .chip {
    position: absolute; left: 28px; top: 20px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #22c55e;
  }
</style>
</head>
<body>
  <div class="box"><div class="chip"></div></div>
</body>
</html>
