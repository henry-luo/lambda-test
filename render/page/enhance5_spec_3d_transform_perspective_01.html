<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 170px; height: 130px; overflow: hidden; }
  body { background: #f8fafc; }
  .scene {
    position: absolute; left: 20px; top: 14px;
    width: 130px; height: 102px;
    border: 3px solid #334155;
    background: #dbeafe;
    perspective: 180px;
  }
  .card {
    position: absolute; left: 30px; top: 24px;
    width: 70px; height: 52px;
    background: linear-gradient(135deg, #f97316, #2563eb);
    transform: rotateY(48deg) rotateX(12deg);
    transform-style: preserve-3d;
    box-shadow: 10px 8px 0 rgba(15, 23, 42, 0.2);
  }
  .card::after {
    content: "";
    position: absolute; right: 8px; top: 8px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fef08a;
  }
</style>
</head>
<body>
  <div class="scene"><div class="card"></div></div>
</body>
</html>
